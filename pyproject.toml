[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "at-options-dashboard"
version = "0.1.0"
description = "Options trading dashboard and governed calibration application"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dash_options*"]

[tool.setuptools.package-data]
dash_options = ["assets/*.css", "assets/*.js", "resources/volatility_history_archive/*.json", "resources/volatility_history_archive/*.gz", "resources/migration_history/*.tar.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

